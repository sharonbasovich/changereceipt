name: Source-pinned Arbiter demonstration
on:
  push:
    branches: ['film/arbiter-source-pinned-20261029']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Confirm app matches reviewed source exactly
        run: |
          test -z "$(git diff --name-only ea098e4837eb7c7c3c2365e844900a21aaa7aef4 -- . ':!scripts/capture-arbiter.mjs' ':!.github/workflows/arbiter-capture.yml')"
          node --check scripts/capture-arbiter.mjs
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Record actual compiled app and verify downloaded receipt
        run: node scripts/capture-arbiter.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: changereceipt-arbiter-real-capture
          path: arbiter-capture/
          retention-days: 7
          if-no-files-found: error
